# One small VPS: engine + n8n + Caddy (automatic HTTPS). SQLite files live in
# ./data and n8n_data, never only inside a container.
#
# Lighter alternative (fits a 1 GB VPS): skip n8n and let the engine schedule
# itself:  set SCHEDULER=internal in .env, then  docker compose up -d engine caddy
services:
  engine:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    expose: ["8080"]
    mem_limit: 512m

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.5
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # workflows read ENGINE_URL / ADMIN_TOKEN from env, not hard-coded
      ENGINE_URL: http://engine:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    expose: ["5678"]
    mem_limit: 1g
    depends_on: [engine]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ENGINE_HOST: ${ENGINE_HOST}
      N8N_HOST: ${N8N_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
